<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c084fc" />
  <title>BIVA.EXE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ BACKGROUND LAYERS (all decorative) ============ -->
  <div class="bg" aria-hidden="true">
    <!-- Big blurred glowing orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>

    <!-- JavaScript fills these containers -->
    <div id="particles"></div>
    <div id="petals"></div>
    <div id="hearts"></div>
  </div>

  <!-- Soft glow that follows the mouse (desktop only) -->
  <div id="cursorGlow" aria-hidden="true"></div>

  <!-- ============ MAIN TERMINAL ============ -->
  <main class="stage">
    <section class="terminal" id="terminal" aria-label="BIVA.EXE terminal">

      <!-- macOS-style header -->
      <header class="terminal-header">
        <div class="dots" aria-hidden="true">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
        </div>
        <div class="terminal-title">HER.exe</div>
        <div class="header-spacer" aria-hidden="true"></div>
      </header>

      <div class="terminal-body" id="terminalBody">

        <!-- Title banner -->
        <div class="banner" aria-hidden="true">
          <span class="banner-text">RESTRICTED⚠️</span>
        </div>

        <!-- Terminal lines are added here by script.js -->
        <div id="output" aria-live="polite"></div>

        <!-- Login form (shown after the boot animation) -->
        <form id="loginForm" class="login-form" autocomplete="off" hidden>
          <label for="nameInput" class="prompt-label">&gt; Who are you?</label>
          <input
            id="nameInput"
            class="terminal-input"
            type="text"
            placeholder="Enter your name..."
            maxlength="40"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <button type="submit" id="accessBtn" class="btn btn-primary">
            <span class="btn-label">ACCESS</span><span class="btn-arrow" aria-hidden="true">→</span>
          </button>
        </form>

        <!-- Try-again button (shown after a wrong name) -->
        <div id="retryRow" class="retry-row" hidden>
          <button type="button" id="retryBtn" class="btn btn-danger">
            <span class="btn-label">TRY AGAIN</span><span class="btn-arrow" aria-hidden="true">→</span>
          </button>
        </div>

        <!-- Command line (shown after a successful login) -->
        <form id="cmdForm" class="cmd-form" autocomplete="off" hidden>
          <label for="cmdInput" class="cmd-prompt">biva@heart:~$</label>
          <input
            id="cmdInput"
            class="cmd-input"
            type="text"
            placeholder="type help"
            maxlength="30"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
        </form>
      </div>
    </section>
  </main>

  <!-- ============ SECRET FILE MODAL ============ -->
  <div class="modal" id="modal" hidden aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle" class="modal-title">🔐 SECRET FILE FOUND</h2>
        <p class="modal-path">/heart/for_biva.txt</p>
      </div>

      <div class="poem" id="poem"></div>

      <div class="poem-heart" id="poemHeart" aria-hidden="true">❤</div>

      <div class="modal-foot">
        <button type="button" id="closeBtn" class="btn btn-primary">
          <span class="btn-label">CLOSE FILE</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ============ MUSIC (optional, never autoplays) ============ -->
  <button type="button" id="musicBtn" class="music-btn" aria-pressed="false">♫ Music</button>
  <audio id="bgMusic" loop preload="none">
    <!-- Put your own file at assets/music.mp3 -->
    <source src="assets/music.mp3" type="audio/mpeg" />
  </audio>

  <script src="script.js"></script>
</body>
</html>
